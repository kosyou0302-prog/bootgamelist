<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <title th:text="${title}"></title>
</head>
<body>
  <div class="container md-4">
    <h1 class="display-4 mb-4" th:text="${title}"></h1>
    <table class="table table-striped table-bordered align-middle text-center">
      <thead>
        <tr>
          <th>ID</th>
          <th>タイトル</th>
          <th>ジャンル</th>
          <th>発売日</th>
          <th>メーカー</th>
          <th>操作</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="item : ${data}">
          <td th:text="${item.id}"></td>
          <td th:text="${item.title}"></td>
          <td>
            <a th:href="@{/genre(genre_id=${item.genre.id})}" th:text="${item.genre.genre}"></a>
          </td>
          <td th:text="${item.releaseDate}"></td>
          <td th:text="${item.maker}"></td>

          <td>
            <form th:action="@{/gameUpdate/{id}(id=${item.id})}" method="get" class="d-inline">
              <input type="hidden" name="id" th:value="${item.id}">
              <button type="submit">更新</button>
            </form>

            <form th:action="@{/gameDelete/{id}(id=${item.id})}" method="get" class="d-inline">
              <input type="hidden" name="id" th:value="${item.id}">
              <button type="submit">削除</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>

    <form th:action="@{/gameInto}" method="get" class="d-inline">
      <input type="hidden" name="id">
      <button type="submit" class="btn-blue btn-sm">追加</button>
    </form>
  </div>
</body>
</html>
