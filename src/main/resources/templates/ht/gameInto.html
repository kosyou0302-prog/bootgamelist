<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <title th:text="${title}"></title>
</head>
<body>
  <div class="container md-4">
    <h1 class="display-4 mb-4" th:text="${title}"></h1>

    <form th:action="@{/gameInto}" method="post" th:object="${formModel}">
      <div>
        <label for="title" class="form-label">タイトル</label>
        <input type="text" class="form-control" th:field="*{title}">
      </div>

      <div>
        <label for="genre" class="form-label">ジャンル</label>
        <input type="text" class="form-control" th:field="*{genre}">
      </div>

      <div>
        <label for="releaseDate" class="form-label">発売日</label>
        <input type="date" class="form-control" th:field="*{releaseDate}">
      </div>

      <div>
        <label for="maker" class="form-label">メーカー</label>
        <input type="text" class="form-control" th:field="*{maker}">
      </div>

      <button type="submit" class="mt-2 mb-2">追加</button>
    </form>

    <form th:action="@{/gameList}" method="get" class="d-inline">
      <button type="submit" class="btn btn-secondary">戻る</button>
    </form>
  </div>
</body>
</html>
