<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <title th:text="${title}"></title>
</head>
<body>
  <div class="container md-4">
    <h1 class="display-4 mb-4" th:text="${title}"></h1>

    <form th:action="@{/genre}" method="post">
      <input type="hidden" th:field="*{id}">
      <ul>
        <li>タイトル： <span th:text="*{title}"></span></li>
        <li>ジャンル： <span th:text="*{genre}"></span></li>
        <li>発売日： <span th:text="*{releaseDate}"></span></li>
        <li>メーカー： <span th:text="*{maker}"></span></li>
      </ul>

      <button type="submit" class="d-inline mt-2 mb-2">削除</button>
    </form>

    <form th:action="@{/gameList}" method="get" class="d-inline">
      <button type="submit" class="btn btn-secondary">戻る</button>
    </form>
  </div>
</body>
</html>
